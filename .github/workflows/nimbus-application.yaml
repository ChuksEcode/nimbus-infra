name: Nimbus application management

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Choose an operation
        required: true
        default: build-and-deploy
        type: choice
        options:
          - build-and-deploy
          - stop-application
          - start-application
          - stop-cluster
          - start-cluster
          - delete-application
      confirmation:
        description: For delete-application only, type nimbus-site
        required: false
        default: ''
        type: string

permissions:
  contents: read

# Use this SAME group in the instructor and infrastructure workflows.
concurrency:
  group: nimbus-environment
  cancel-in-progress: false

jobs:
  manage:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPERATION: ${{ inputs.operation }}
      CONFIRMATION: ${{ inputs.confirmation }}
      RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
      AKS_CLUSTER: ${{ secrets.AZURE_AKS_CLUSTER }}
      ACR_LOGIN_SERVER: ${{ secrets.AZURE_CONTAINER_REGISTRY }}
      NAMESPACE: default
      DEPLOYMENT_NAME: nimbus-site
      CONTAINER_NAME: nimbus-site
      SERVICE_NAME: nimbus-site

    steps:
      - name: Check selected operation and branch
        shell: bash
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = refs/heads/main ] || { echo 'Run this workflow from main.'; exit 1; }
          : "${RESOURCE_GROUP:?AZURE_RESOURCE_GROUP is missing}"
          : "${AKS_CLUSTER:?AZURE_AKS_CLUSTER is missing}"
          if [ "$OPERATION" = delete-application ] && [ "$CONFIRMATION" != "$DEPLOYMENT_NAME" ]; then
            echo 'To delete the application, enter nimbus-site in confirmation.'
            exit 1
          fi
          echo "Selected operation: $OPERATION"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Start or stop AKS
        if: inputs.operation == 'start-cluster' || inputs.operation == 'stop-cluster'
        shell: bash
        run: bash scripts/nimbus-cluster.sh

      - name: Check AKS is running and identify kubectl version
        id: cluster
        if: inputs.operation != 'start-cluster' && inputs.operation != 'stop-cluster'
        shell: bash
        run: |
          set -euo pipefail
          POWER_STATE="$(az aks show -g "$RESOURCE_GROUP" -n "$AKS_CLUSTER" --query powerState.code -o tsv)"
          PROVISIONING_STATE="$(az aks show -g "$RESOURCE_GROUP" -n "$AKS_CLUSTER" --query provisioningState -o tsv)"
          if [ "$POWER_STATE" != Running ] || [ "$PROVISIONING_STATE" != Succeeded ]; then
            echo "AKS is not ready: power=$POWER_STATE provisioning=$PROVISIONING_STATE"
            echo 'Choose start-cluster first, then run this operation again after startup completes.'
            exit 1
          fi
          VERSION="$(az aks show -g "$RESOURCE_GROUP" -n "$AKS_CLUSTER" --query kubernetesVersion -o tsv)"
          echo "version=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install matching kubectl
        if: inputs.operation != 'start-cluster' && inputs.operation != 'stop-cluster'
        uses: azure/setup-kubectl@v4
        with:
          version: ${{ steps.cluster.outputs.version }}

      - name: Install AKS authentication helper
        if: inputs.operation != 'start-cluster' && inputs.operation != 'stop-cluster'
        uses: azure/use-kubelogin@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          kubelogin-version: latest

      - name: Get AKS credentials
        if: inputs.operation != 'start-cluster' && inputs.operation != 'stop-cluster'
        shell: bash
        run: |
          set -euo pipefail
          az aks get-credentials -g "$RESOURCE_GROUP" -n "$AKS_CLUSTER" --overwrite-existing
          kubelogin convert-kubeconfig -l azurecli
          kubectl config current-context
          kubectl get nodes

      - name: Prepare image details
        if: inputs.operation == 'build-and-deploy'
        shell: bash
        run: |
          set -euo pipefail
          : "${ACR_LOGIN_SERVER:?AZURE_CONTAINER_REGISTRY is missing}"
          ACR_NAME="${ACR_LOGIN_SERVER%%.*}"
          echo "ACR_NAME=$ACR_NAME" >> "$GITHUB_ENV"
          echo "IMAGE=${ACR_LOGIN_SERVER}/nimbus-site:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Login to ACR
        if: inputs.operation == 'build-and-deploy'
        run: az acr login --name "$ACR_NAME"

      - name: Build image
        if: inputs.operation == 'build-and-deploy'
        run: docker build -t "$IMAGE" ./nimbus-site

      - name: Push image
        if: inputs.operation == 'build-and-deploy'
        run: docker push "$IMAGE"

      - name: Deploy or manage application
        if: inputs.operation != 'start-cluster' && inputs.operation != 'stop-cluster'
        shell: bash
        run: |
          set -euo pipefail
          case "$OPERATION" in
            build-and-deploy)
              # Prepare the manifest with this commit's image; do not edit the repository file.
              kubectl set image -f k8s/deployment.yaml "$CONTAINER_NAME=$IMAGE" --local -o yaml |
                kubectl apply --namespace "$NAMESPACE" -f -
              kubectl apply --namespace "$NAMESPACE" -f k8s/service.yaml
              kubectl rollout status deployment/"$DEPLOYMENT_NAME" -n "$NAMESPACE" --timeout=300s
              ;;
            stop-application)
              kubectl scale deployment "$DEPLOYMENT_NAME" -n "$NAMESPACE" --replicas=0
              # Kubernetes may omit .status.replicas when it is zero.
              for attempt in {1..60}; do
                REPLICAS="$(kubectl get deployment "$DEPLOYMENT_NAME" -n "$NAMESPACE" -o jsonpath='{.status.replicas}')"
                if [ "${REPLICAS:-0}" = 0 ]; then break; fi
                if [ "$attempt" = 60 ]; then echo 'Timed out waiting for zero replicas.'; exit 1; fi
                sleep 5
              done
              ;;
            start-application)
              kubectl scale deployment "$DEPLOYMENT_NAME" -n "$NAMESPACE" --replicas=2
              kubectl rollout status deployment/"$DEPLOYMENT_NAME" -n "$NAMESPACE" --timeout=300s
              ;;
            delete-application)
              kubectl delete service "$SERVICE_NAME" -n "$NAMESPACE" --ignore-not-found --timeout=300s
              kubectl delete deployment "$DEPLOYMENT_NAME" -n "$NAMESPACE" --ignore-not-found --timeout=300s
              ;;
            *) echo 'Unsupported operation'; exit 1 ;;
          esac

      - name: Show application results
        if: success() && inputs.operation != 'start-cluster' && inputs.operation != 'stop-cluster'
        shell: bash
        run: |
          set -euo pipefail
          kubectl get deployment "$DEPLOYMENT_NAME" -n "$NAMESPACE" --ignore-not-found
          kubectl get pods -l app=nimbus-site -n "$NAMESPACE" -o wide
          kubectl get service "$SERVICE_NAME" -n "$NAMESPACE" --ignore-not-found
          if [ "$OPERATION" != delete-application ]; then
            kubectl get deployment "$DEPLOYMENT_NAME" -n "$NAMESPACE" \
              -o jsonpath='{range .spec.template.spec.containers[*]}{.name}{" -> "}{.image}{"\n"}{end}'
          fi
          {
            echo '## Nimbus operation completed'
            echo "Operation: $OPERATION"
            echo 'See Show application results for replicas, Pods and the Service address.'
          } >> "$GITHUB_STEP_SUMMARY"

name: Set up pipeline access

# Run manually from the Actions page.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup-access:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Authenticate with the identity allowed to assign roles.
      - name: Azure setup login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_SETUP_CREDENTIALS }}

      - name: Configure pipeline access
        shell: bash
        env:
          RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          EXPECTED_APP_NAME: ${{ vars.AZURE_PIPELINE_APP_NAME }}
          PIPELINE_CLIENT_ID: ${{ fromJSON(secrets.AZURE_CREDENTIALS).clientId }}
          TARGET_SUBSCRIPTION_ID: ${{ fromJSON(secrets.AZURE_CREDENTIALS).subscriptionId }}
        run: |
          set -euo pipefail

          az account set --subscription "$TARGET_SUBSCRIPTION_ID"

          bash scripts/setup-pipeline-access.sh
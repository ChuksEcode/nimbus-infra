apiVersion: apps/v1
kind: Deployment

metadata:
  name: nimbus-site
  labels:
    app: nimbus-site

spec:
  replicas: 2                                             # run 2 pods

  selector:
    matchLabels:
      app: nimbus-site

  strategy:
    type: RollingUpdate                                     # default, safe rollouts

  template:
    metadata:
      labels:
        app: nimbus-site

    spec:
      containers:
        - name: nimbus-site
          image: nimbusacrdev01.azurecr.io/nimbus-site:v1    # my ACR image
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80

          resources:                                          # tiny but realistic resource requests and limits
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10